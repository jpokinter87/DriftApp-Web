# Installé par scripts/update_driftapp.sh dans
# /etc/systemd/system/systemd-time-wait-sync.service.d/driftapp.conf
#
# Les services DriftApp démarrent après time-sync.target : ils attendent que le
# Pi soit remis à l'heure par internet (≈ 30 s après une coupure de courant).
# Sans internet, l'attente s'arrête au bout de 90 s et la coupole démarre quand même.
[Service]
TimeoutStartSec=90
